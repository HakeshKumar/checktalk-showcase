<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">CheckTalk real-time data platform architecture</title>
  <desc id="desc">The production player commentary path and asynchronous streaming telemetry and analytics path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/><stop offset="1" stop-color="#12182a"/>
    </linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182653"/><stop offset="1" stop-color="#3d1f69"/>
    </linearGradient>
    <linearGradient id="future" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b38"/><stop offset="1" stop-color="#174c45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#aebde0"/>
    </marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#67d9b8"/>
    </marker>
    <style>
      .title{font:700 28px Inter,system-ui,sans-serif;fill:#f7f8ff}.sub{font:400 13px Inter,system-ui,sans-serif;fill:#9da8c0}
      .section{font:700 17px Inter,system-ui,sans-serif;fill:#f4f6ff}.label{font:650 13px Inter,system-ui,sans-serif;fill:#f0f3ff}
      .small{font:400 11px Inter,system-ui,sans-serif;fill:#b6c0d7}.tiny{font:600 9px Inter,system-ui,sans-serif;fill:#8f9bb5;letter-spacing:.4px}
      .box{filter:url(#shadow);stroke-width:1.3}.inner{fill:#0c1120;fill-opacity:.68;stroke:#fff;stroke-opacity:.14}
      .flow{fill:none;stroke:#aebde0;stroke-width:2.2;marker-end:url(#arrow)}.futureFlow{fill:none;stroke:#67d9b8;stroke-width:2.2;marker-end:url(#greenArrow)}
      .dash{stroke-dasharray:6 6}.badge{font:700 9px Inter,system-ui,sans-serif;fill:#dce5ff;letter-spacing:.6px}
    </style>
  </defs>

  <rect width="1000" height="700" fill="url(#bg)"/>
  <circle cx="850" cy="65" r="180" fill="#7f4de0" opacity=".08"/>
  <circle cx="120" cy="670" r="220" fill="#3178dd" opacity=".07"/>

  <text x="38" y="47" class="title">CheckTalk — Real-Time Data Platform</text>
  <text x="38" y="70" class="sub">Ordered event streaming, durable Bronze storage, serverless analytics, and a low-latency serving plane.</text>

  <rect x="38" y="93" width="924" height="282" rx="20" class="box" fill="url(#current)" stroke="#8e74e8"/>
  <text x="58" y="122" class="section">Operational serving plane</text>
  <text x="854" y="121" class="badge">LIVE</text>

  <rect x="58" y="151" width="155" height="142" rx="14" class="inner"/>
  <text x="75" y="180" class="label">CloudFront app</text>
  <text x="75" y="204" class="small">React from private S3</text>
  <text x="75" y="225" class="small">chess.js + Stockfish</text>
  <text x="75" y="246" class="small">Route 53 + ACM TLS</text>
  <text x="75" y="274" class="badge">BROWSER</text>

  <rect x="258" y="151" width="126" height="142" rx="14" class="inner"/>
  <text x="275" y="180" class="label">API Gateway</text>
  <text x="275" y="204" class="small">POST /commentary</text>
  <text x="275" y="225" class="small">CORS + throttling</text>
  <text x="275" y="274" class="badge">HTTP API</text>

  <rect x="429" y="137" width="177" height="170" rx="14" class="inner"/>
  <text x="446" y="166" class="label">Python Lambda</text>
  <text x="446" y="190" class="small">1. validate request</text>
  <text x="446" y="211" class="small">2. recompute eval delta</text>
  <text x="446" y="232" class="small">3. deterministic classifier</text>
  <rect x="446" y="250" width="143" height="37" rx="8" fill="#151a28" stroke="#ffbd66" stroke-opacity=".45"/>
  <text x="459" y="273" class="tiny">CLASSIFY EACH MOVE LOCALLY</text>

  <rect x="652" y="151" width="130" height="142" rx="14" class="inner"/>
  <text x="669" y="180" class="label">Bedrock + Polly</text>
  <text x="669" y="204" class="small">Nova Lite</text>
  <text x="669" y="225" class="small">language only</text>
  <text x="669" y="246" class="small">text + MP3 voice</text>
  <text x="669" y="274" class="badge">SHORT TEXT + MP3</text>

  <rect x="827" y="151" width="115" height="142" rx="14" class="inner"/>
  <text x="844" y="180" class="label">Commentary UI</text>
  <text x="844" y="204" class="small">JSON response</text>
  <text x="844" y="225" class="small">latest reaction</text>
  <text x="844" y="246" class="small">event label</text>
  <text x="844" y="274" class="badge">NATURAL QUEUE</text>

  <path d="M213 222H258" class="flow"/><path d="M384 222H429" class="flow"/>
  <path d="M606 222H652" class="flow"/><path d="M782 222H827" class="flow"/>
  <path d="M884 293V339H717V293" class="flow"/>
  <text x="739" y="356" class="tiny">SYNCHRONOUS JSON RESPONSE</text>

  <rect x="38" y="410" width="924" height="234" rx="20" class="box" fill="url(#future)" stroke="#53cfa8"/>
  <text x="58" y="440" class="section">Streaming data and analytics plane</text>

  <rect x="58" y="468" width="144" height="116" rx="13" class="inner"/>
  <text x="75" y="497" class="label">Lifecycle events</text>
  <text x="75" y="521" class="small">non-blocking POST</text>
  <text x="75" y="542" class="small">schema v1 + correlation</text>
  <text x="75" y="566" class="badge">BROWSER</text>

  <rect x="244" y="468" width="144" height="116" rx="13" class="inner"/>
  <text x="261" y="497" class="label">Ingest + Kinesis</text>
  <text x="261" y="521" class="small">validate then publish</text>
  <text x="261" y="542" class="small">key = game_id</text>
  <text x="261" y="566" class="badge">ORDERED STREAM</text>

  <rect x="430" y="468" width="144" height="116" rx="13" class="inner"/>
  <text x="447" y="497" class="label">Persist consumer</text>
  <text x="447" y="521" class="small">partial batch retries</text>
  <text x="447" y="542" class="small">bisection + SQS DLQ</text>
  <text x="447" y="566" class="badge">LAMBDA</text>

  <rect x="616" y="468" width="144" height="116" rx="13" class="inner"/>
  <text x="633" y="497" class="label">S3 Bronze</text>
  <text x="633" y="521" class="small">encrypted + versioned</text>
  <text x="633" y="542" class="small">date/type/game partitions</text>
  <text x="633" y="566" class="badge">REPLAY + AUDIT</text>

  <rect x="802" y="468" width="140" height="116" rx="13" class="inner"/>
  <text x="819" y="497" class="label">Glue + Athena</text>
  <text x="819" y="521" class="small">partition projection</text>
  <text x="819" y="542" class="small">guardrailed queries</text>
  <text x="819" y="566" class="badge">ANALYTICS</text>

  <path d="M202 526H244" class="futureFlow"/><path d="M388 526H430" class="futureFlow"/>
  <path d="M574 526H616" class="futureFlow"/><path d="M760 526H802" class="futureFlow"/>

  <text x="38" y="674" class="sub">Production: checktalk.hakeshk.com · Security, access logs, alarms, and service telemetry in CloudWatch.</text>
</svg>
